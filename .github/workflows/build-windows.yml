name: Build Windows app

# Every push builds QwenChat-windows-x64.zip (QwenChat.exe + its files) and attaches it to the run.
# No model is bundled: the app downloads one from its Models menu (or copy a .gguf in yourself).
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      avx2:
        description: "Build for AVX2 CPUs (uncheck only for PCs older than ~2013)"
        type: boolean
        default: true

env:
  LLAMA_TAG: b11963          # llama.cpp release native/chat_bridge.cpp is written against

jobs:
  build:
    runs-on: windows-2022    # Visual Studio 2022 with CMake is preinstalled
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ---- llama.cpp -> libs/chatbridge.dll --------------------------------------------------
      - name: Choose CPU baseline
        id: cpu
        run: |
          $avx2 = "${{ github.event.inputs.avx2 }}"
          if ($avx2 -eq "") { $avx2 = "true" }
          "avx2=$avx2" >> $env:GITHUB_OUTPUT

      - name: Cache native library
        id: native-cache
        uses: actions/cache@v4
        with:
          path: libs/chatbridge.dll
          key: chatbridge-win64-${{ env.LLAMA_TAG }}-avx2-${{ steps.cpu.outputs.avx2 }}-${{ hashFiles('native/**') }}

      - name: Build llama.cpp + chatbridge.dll
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          $avx2 = [bool]::Parse("${{ steps.cpu.outputs.avx2 }}")
          ./native/build_windows.ps1 -LlamaTag $env:LLAMA_TAG -Avx2:$avx2

      - name: Check the DLL loads and exports the bridge
        run: |
          python -c "import ctypes; lib = ctypes.CDLL(r'libs\chatbridge.dll'); lib.chat_system_info.restype = ctypes.c_char_p; [getattr(lib, n) for n in ('chat_load','chat_start','chat_next','chat_abort','chat_reset','chat_free','chat_count_tokens','chat_cached_tokens','chat_error')]; print('chatbridge.dll OK:', lib.chat_system_info().decode())"

      # ---- QwenChat.exe ---------------------------------------------------------------------------
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check main.py compiles
        run: python -m py_compile main.py

      - name: Build QwenChat.exe with PyInstaller
        timeout-minutes: 15    # normally 2-4 min; a hang (e.g. a Kivy error MessageBox) fails fast
        run: pyinstaller --noconfirm qwenchat.spec

      - name: Zip the app
        run: |
          Copy-Item INSTRUCTIONS.txt dist/QwenChat/
          New-Item -ItemType Directory -Force dist/QwenChat/models | Out-Null
          Compress-Archive -Path dist/QwenChat -DestinationPath QwenChat-windows-x64.zip -Force
          Get-Item QwenChat-windows-x64.zip | Select-Object Name, @{n="MB";e={[math]::Round($_.Length / 1MB, 1)}}

      - uses: actions/upload-artifact@v7
        with:
          name: QwenChat-windows-x64
          path: QwenChat-windows-x64.zip
          if-no-files-found: error
